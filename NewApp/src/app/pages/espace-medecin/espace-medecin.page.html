<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Espace Médecin</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Espace Médecin</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Section Disponibilités -->
  <ion-card>
    <ion-card-header (click)="showDisponibilites = !showDisponibilites">
      <ion-card-title>
        <ion-icon [name]="showDisponibilites ? 'chevron-down' : 'chevron-forward'"></ion-icon>
        Gestion des disponibilités
      </ion-card-title>
    </ion-card-header>

    <ion-card-content *ngIf="showDisponibilites">
      <!-- Liste des jours avec gestion des états vides -->
      <ion-list>
        <ion-item-group *ngFor="let jour of ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi']">
          <ion-item-divider>
            <ion-label>{{ jour | titlecase }}</ion-label>
            <ion-button slot="end" fill="clear" (click)="ajouterCreneau(jour)">
              <ion-icon name="add" slot="icon-only"></ion-icon>
            </ion-button>
          </ion-item-divider>

          <!-- Affichage des créneaux existants -->
          <ion-item *ngFor="let creneau of disponibilites[jour]; let i = index">
            <ion-label>
              {{ creneau.debut }} - {{ creneau.fin }}
            </ion-label>
            <ion-button fill="clear" color="danger" (click)="supprimerCreneau(jour, i)">
              <ion-icon name="trash" slot="icon-only"></ion-icon>
            </ion-button>
          </ion-item>

          <!-- Message si aucun créneau -->
          <ion-item *ngIf="disponibilites[jour]?.length === 0" color="light">
            <ion-label class="ion-text-center">
              <i>Aucun créneau défini</i>
            </ion-label>
          </ion-item>
        </ion-item-group>
      </ion-list>

      <!-- Bouton de sauvegarde -->
      <ion-button 
        expand="block" 
        color="primary" 
        (click)="saveDisponibilites()"
        [disabled]="!showDisponibilites">
        <ion-icon name="save" slot="start"></ion-icon>
        Enregistrer les modifications
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
