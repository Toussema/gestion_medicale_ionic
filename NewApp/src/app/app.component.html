<ion-app>
    <!-- Contenu de l'application -->
    <ion-router-outlet></ion-router-outlet>
    
    <ion-header>
      <ion-toolbar>
        <ion-title>MediConnect</ion-title>
        <ion-buttons slot="end">
                <!-- Bouton pour ouvrir le menu profil -->
                <ion-button (click)="openProfileMenu($event)">
                  <ion-icon name="person-circle-outline"></ion-icon>
                </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

  <!-- Menu profil (popover) -->
  <ion-popover [isOpen]="isProfileMenuOpen" (didDismiss)="closeProfileMenu()">
    <ng-template>
      <ion-content>
        <ion-list>
          <!-- Afficher le nom et le rôle de l'utilisateur -->
          <ion-item *ngIf="isLoggedIn && user">
            <ion-icon name="person-circle-outline" slot="start"></ion-icon>
            <ion-label>
              <h2>{{ user.name }}</h2>
              <p>{{ user.role }}</p>
            </ion-label>
          </ion-item>

          <!-- Bouton Se déconnecter (visible si connecté) -->
          <ion-item *ngIf="isLoggedIn" button (click)="logout()">
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            <ion-label>Se déconnecter</ion-label>
          </ion-item>

          <!-- Bouton S'inscrire (visible si non connecté) -->
          <ion-item *ngIf="!isLoggedIn" button (click)="navigateTo('/register')">
            <ion-icon name="person-add-outline" slot="start"></ion-icon>
            <ion-label>S'inscrire</ion-label>
          </ion-item>

          <!-- Bouton Se connecter (visible si non connecté) -->
          <ion-item *ngIf="!isLoggedIn" button (click)="navigateTo('/login')">
            <ion-icon name="log-in-outline" slot="start"></ion-icon>
            <ion-label>Se connecter</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ng-template>
  </ion-popover>


  <ion-tabs>
    <ion-tab-bar slot="bottom">
    <!-- Onglet home -->
    <ion-tab-button tab="home" (click)="navigateTo('/home')">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Accueil</ion-label>
    </ion-tab-button>

    <!-- Onglet Rendez-vous -->
      <ion-tab-button tab="rendez-vous" (click)="navigateTo('/rendez-vous')">
        <ion-icon name="calendar-outline"></ion-icon>
        <ion-label>Rendez-vous</ion-label>
      </ion-tab-button>
  
      <!-- Onglet Documents -->
      <ion-tab-button tab="documents" (click)="navigateTo('/documents')">
        <ion-icon name="document-text-outline"></ion-icon>
        <ion-label>Documents</ion-label>
      </ion-tab-button>
  
      <!-- Onglet Paramètres -->
      <ion-tab-button tab="parametres" (click)="navigateTo('/parametres')">
        <ion-icon name="settings-outline"></ion-icon>
        <ion-label>Paramètres</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>


</ion-app>
